<div class="reg-box">
    <h2>Cambiar contraseña</h2>
    <p>Introduce tu nueva contraseña y confírmala.</p>
    <div class="reg-grid" style="grid-template-columns: 1fr;">
        <div class="form-group"><label>Nueva contraseña</label><input type="password" placeholder="••••••••"></div>
        <div class="form-group"><label>Repetir nueva contraseña</label><input type="password" placeholder="••••••••"></div>
    </div>
    <button class="btn-submit" style="margin-top: 1.5rem;" (click)="onChangePassword()">ACTUALIZAR CONTRASEÑA</button>
</div>
