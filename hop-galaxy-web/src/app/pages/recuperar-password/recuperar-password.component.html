<div class="reg-box">
    <h2>Recuperar contraseña</h2>
    <p>Introduce tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.</p>
    <div class="reg-grid" style="grid-template-columns: 1fr;">
        <div class="form-group"><label>Email</label><input type="email" placeholder="tu@email.com"></div>
    </div>
    <div style="margin:1.5rem 0 1.2rem; font-size:0.85rem; color:var(--text-muted); line-height:1.6; text-align: center">
        <a routerLink="/login" style="color:var(--primary); font-weight: bold;">Volver al inicio de sesión</a>
    </div>
    <button class="btn-submit" (click)="onRecover()">ENVIAR INSTRUCCIONES</button>
</div>
